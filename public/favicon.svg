<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- M-Ber High Precision Favicon -->
  <defs>
    <linearGradient id="fav-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="fav-arrow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
  </defs>

  <!-- Clean Rounded Square Container for high contrast on light or dark browser tabs -->
  <rect x="25" y="25" width="450" height="450" rx="110" fill="#0F172A" />

  <g id="fav-mark" transform="translate(25, 25) scale(0.9)">
    <!-- Outer "M" -->
    <path
      d="M 90 410 L 90 152 C 90 92 144 76 180 112 L 250 182"
      fill="none"
      stroke="url(#fav-green)"
      stroke-width="30"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 250 182 L 320 112 C 356 76 410 92 410 152 L 410 410"
      fill="none"
      stroke="url(#fav-green)"
      stroke-width="30"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Gable Roof -->
    <path
      d="M 145 320 L 250 215 L 355 320"
      fill="none"
      stroke="url(#fav-green)"
      stroke-width="30"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Base Walls & Foundation -->
    <path
      d="M 175 298 L 175 385 C 175 409 194 418 222 418 L 278 418 C 306 418 325 409 325 385 L 325 295"
      fill="none"
      stroke="url(#fav-green)"
      stroke-width="30"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Chimney -->
    <path
      d="M 325 285 L 325 218"
      fill="none"
      stroke="url(#fav-green)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Upward Growth Arrow -->
    <path
      d="M 296 222 L 325 170 L 354 222 Z"
      fill="url(#fav-arrow)"
      stroke="#10B981"
      stroke-width="6"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- 4-Pane Window -->
    <path
      d="M 223 310 L 223 296 C 223 288 230 284 243 284 L 244 284 L 244 310 Z"
      fill="#34D399"
    />
    <path
      d="M 256 310 L 256 284 L 257 284 C 270 284 277 288 277 296 L 277 310 Z"
      fill="#34D399"
    />
    <rect
      x="223"
      y="316"
      width="21"
      height="21"
      rx="4"
      fill="#34D399"
    />
    <rect
      x="256"
      y="316"
      width="21"
      height="21"
      rx="4"
      fill="#34D399"
    />
  </g>
</svg>
