<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- M-Ber Official Logo - High Precision Vector (Light Mode) -->
  <defs>
    <linearGradient id="mber-green-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23533E" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <linearGradient id="mber-arrow-light" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <g id="mber-mark">
    <!-- Outer "M" Architecture -->
    <path
      d="M 90 410 L 90 152 C 90 92 144 76 180 112 L 250 182"
      fill="none"
      stroke="url(#mber-green-light)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 250 182 L 320 112 C 356 76 410 92 410 152 L 410 410"
      fill="none"
      stroke="url(#mber-green-light)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- House Gable Roof (45° Symmetrical Pitch) -->
    <path
      d="M 145 320 L 250 215 L 355 320"
      fill="none"
      stroke="url(#mber-green-light)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- House Base Walls & Smooth Curved Foundation -->
    <path
      d="M 175 298 L 175 385 C 175 409 194 418 222 418 L 278 418 C 306 418 325 409 325 385 L 325 295"
      fill="none"
      stroke="url(#mber-green-light)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Chimney Vertical Shaft on Right Roof Slope -->
    <path
      d="M 325 285 L 325 218"
      fill="none"
      stroke="url(#mber-green-light)"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Upward Growth Arrow Indicator (Financial Prosperity & Rising Budget Health) -->
    <path
      d="M 298 220 L 325 174 L 352 220 Z"
      fill="url(#mber-arrow-light)"
      stroke="url(#mber-green-light)"
      stroke-width="5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- 4-Pane Arched Center Window -->
    <!-- Top-Left Pane (Arched) -->
    <path
      d="M 223 310 L 223 296 C 223 288 230 284 243 284 L 244 284 L 244 310 Z"
      fill="#23533E"
    />
    <!-- Top-Right Pane (Arched) -->
    <path
      d="M 256 310 L 256 284 L 257 284 C 270 284 277 288 277 296 L 277 310 Z"
      fill="#23533E"
    />
    <!-- Bottom-Left Pane -->
    <rect
      x="223"
      y="316"
      width="21"
      height="21"
      rx="3.5"
      fill="#23533E"
    />
    <!-- Bottom-Right Pane -->
    <rect
      x="256"
      y="316"
      width="21"
      height="21"
      rx="3.5"
      fill="#23533E"
    />
  </g>
</svg>
